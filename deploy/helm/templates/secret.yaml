{{- /*
Secret de aplicación. Por defecto NO se crea por Helm — se asume gestionado
fuera del chart (kubectl create secret / SealedSecrets / external-secrets).
Activar `secret.create=true` y pasar valores reales con `--set-file` SOLO si
se hace localmente y los valores no se commitean.
*/ -}}
{{- /* Con Vault habilitado los secretos llegan por /vault/secrets/config; no se crea Secret k8s. */ -}}
{{- if and (not .Values.vault.enabled) .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "maya-dms.secretName" . }}
  labels:
    {{- include "maya-dms.labels" . | nindent 4 }}
  annotations:
    # Igual que el ConfigMap: el Secret debe existir antes del Job de migración.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
stringData:
{{- range $key, $value := .Values.secret.data }}
  {{ $key }}: {{ $value | quote }}
{{- end }}
{{- end }}
